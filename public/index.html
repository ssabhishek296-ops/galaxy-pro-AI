<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>♾️ Galaxy — Study Assistant</title>
<style>
  :root{
    --bg:#0A0B16;
    --surface:#13152A;
    --surface2:#1B1E3B;
    --violet:#7C5CFC;
    --cyan:#35D9C8;
    --text:#E9E7F7;
    --muted:#8D89AC;
    --border:#282B4E;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(124,92,252,0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(53,217,200,0.12), transparent 45%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:24px 16px;
  }
  .wrap{
    width:100%;
    max-width:640px;
    display:flex;
    flex-direction:column;
    height:calc(100vh - 48px);
  }
  header{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:6px 4px 18px;
  }
  .logo-wrap{
    position:relative;
    width:40px;height:32px;
    flex-shrink:0;
  }
  .logo-base, .logo-shine{
    position:absolute;
    inset:0;
    -webkit-mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path d='M484.6 96C407 96 353.4 165.4 320 217.1C286.6 165.4 233 96 155.4 96C69.5 96 0 165.5 0 251.4C0 337.3 69.5 406.9 155.4 406.9C233 406.9 286.6 337.4 320 285.7C353.4 337.4 407 406.9 484.6 406.9C570.5 406.9 640 337.4 640 251.4C640 165.4 570.5 96 484.6 96zM155.4 358.3C96.2 358.3 48.6 310.6 48.6 251.4C48.6 192.2 96.2 144.6 155.4 144.6C209.4 144.6 251.9 189.6 285.3 241.4C286.9 244 288.6 246.7 290.3 249.4C286.5 255.6 282.7 261.8 278.9 267.9C245.9 318.5 203.7 358.3 155.4 358.3zM484.6 358.3C436.3 358.3 394.1 318.5 361.1 267.9C357.3 261.8 353.5 255.6 349.7 249.4C351.4 246.7 353.1 244 354.7 241.4C388.1 189.6 430.6 144.6 484.6 144.6C543.8 144.6 591.4 192.2 591.4 251.4C591.4 310.6 543.8 358.3 484.6 358.3z'/></svg>");
    mask-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 512'><path d='M484.6 96C407 96 353.4 165.4 320 217.1C286.6 165.4 233 96 155.4 96C69.5 96 0 165.5 0 251.4C0 337.3 69.5 406.9 155.4 406.9C233 406.9 286.6 337.4 320 285.7C353.4 337.4 407 406.9 484.6 406.9C570.5 406.9 640 337.4 640 251.4C640 165.4 570.5 96 484.6 96zM155.4 358.3C96.2 358.3 48.6 310.6 48.6 251.4C48.6 192.2 96.2 144.6 155.4 144.6C209.4 144.6 251.9 189.6 285.3 241.4C286.9 244 288.6 246.7 290.3 249.4C286.5 255.6 282.7 261.8 278.9 267.9C245.9 318.5 203.7 358.3 155.4 358.3zM484.6 358.3C436.3 358.3 394.1 318.5 361.1 267.9C357.3 261.8 353.5 255.6 349.7 249.4C351.4 246.7 353.1 244 354.7 241.4C388.1 189.6 430.6 144.6 484.6 144.6C543.8 144.6 591.4 192.2 591.4 251.4C591.4 310.6 543.8 358.3 484.6 358.3z'/></svg>");
    -webkit-mask-size:contain;
    mask-size:contain;
    -webkit-mask-repeat:no-repeat;
    mask-repeat:no-repeat;
    -webkit-mask-position:center;
    mask-position:center;
  }
  .logo-base{
    background:linear-gradient(135deg, #FFD166, #FF7A45 55%, #EF476F 100%);
    animation: logo-glow 2.8s ease-in-out infinite;
  }
  .logo-shine{
    background:linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.95) 50%, transparent 65%);
    background-size:260% 260%;
    mix-blend-mode:screen;
    animation: logo-shimmer 2.8s linear infinite;
  }
  @keyframes logo-glow{
    0%,100%{ filter: drop-shadow(0 0 6px rgba(255,122,69,0.5)); }
    50%{ filter: drop-shadow(0 0 14px rgba(239,71,111,0.8)); }
  }
  @keyframes logo-shimmer{
    0%{ background-position: -120% -120%; }
    100%{ background-position: 120% 120%; }
  }
  h1{
    font-size:22px;
    font-weight:600;
    margin:0;
    letter-spacing:0.2px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .pro-badge{
    font-size:10px;
    font-weight:700;
    letter-spacing:0.6px;
    padding:2px 7px;
    border-radius:6px;
    background:linear-gradient(135deg, #F4C874, #E8846B);
    color:#1A0F08;
  }
  .usage-bar{
    font-size:12px;
    color:var(--muted);
    padding:0 4px 10px;
  }
  .upgrade-msg{
    background:var(--surface);
    border:1px solid var(--violet);
    border-radius:14px;
    padding:16px;
    text-align:center;
    font-size:14px;
    line-height:1.6;
    margin:auto;
    max-width:320px;
  }
  .upgrade-msg b{
    display:block;
    font-size:16px;
    margin-bottom:6px;
    background:linear-gradient(135deg, var(--cyan), var(--violet));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .upgrade-btn{
    margin-top:12px;
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    border:none;
    color:#0A0B16;
    font-weight:700;
    font-size:13px;
    padding:9px 18px;
    border-radius:20px;
    cursor:pointer;
  }
  header p{
    margin:0 0 0 4px;
    color:var(--muted);
    font-size:13px;
  }
  .chat{
    flex:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
    padding:8px 4px 16px;
  }
  .msg{
    max-width:85%;
    padding:12px 14px;
    border-radius:14px;
    line-height:1.55;
    font-size:15px;
    white-space:pre-wrap;
  }
  .msg.user{
    align-self:flex-end;
    background:var(--violet);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .msg.ai{
    align-self:flex-start;
    background:var(--surface);
    border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.ai.loading{color:var(--muted); font-style:italic;}
  .msg img{
    max-width:220px;
    border-radius:10px;
    display:block;
    margin-top:8px;
  }
  .empty{
    color:var(--muted);
    font-size:14px;
    margin:auto;
    text-align:center;
    padding:0 20px;
    line-height:1.6;
  }
  .empty b{color:var(--text);}
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:16px;
  }
  .chip{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-size:13px;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
  }
  .chip:hover{border-color:var(--violet);}
  form{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:8px 8px 8px 14px;
  }
  form.focus{border-color:var(--violet);}
  textarea{
    flex:1;
    resize:none;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-size:15px;
    font-family:inherit;
    max-height:110px;
    line-height:1.5;
    padding:6px 0;
  }
  textarea::placeholder{color:var(--muted);}
  .icon-btn{
    width:38px;height:38px;
    border-radius:10px;
    border:none;
    background:var(--surface2);
    color:var(--muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:hover{color:var(--text);}
  .send-btn{
    background:linear-gradient(135deg, var(--violet), var(--cyan));
    color:#0A0B16;
    font-weight:700;
  }
  .send-btn:disabled{opacity:0.4;cursor:default;}
  #preview-strip{
    display:none;
    gap:8px;
    padding:0 4px 8px;
  }
  #preview-strip.show{display:flex;}
  .thumb{
    position:relative;
    width:52px;height:52px;
    border-radius:8px;
    overflow:hidden;
    border:1px solid var(--border);
  }
  .thumb img{width:100%;height:100%;object-fit:cover;}
  .thumb button{
    position:absolute;top:2px;right:2px;
    width:16px;height:16px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,0.7);
    color:#fff;
    font-size:10px;
    line-height:1;
    cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-wrap">
      <div class="logo-base"></div>
      <div class="logo-shine"></div>
    </div>
    <h1>Galaxy <span class="pro-badge">PRO</span></h1>
    <p>every question, answered.</p>
  </header>

  <div class="chat" id="chat">
    <div class="empty" id="empty-state">
      Koi bhi doubt type karo, ya <b>history/story ka photo</b> upload karke poochho —<br>
      Galaxy aapko simple bhasha mein samjhayega.
      <div class="suggestions">
        <button class="chip" data-text="Ye formula samjhao: ">Formula samjhao</button>
        <button class="chip" data-text="Is chapter ka syllabus batao: ">Syllabus batao</button>
        <button class="chip" data-text="Mera doubt hai: ">Doubt poochho</button>
        <button class="chip" data-text="">Photo upload karo</button>
      </div>
    </div>
  </div>

  <div id="preview-strip"></div>

  <form id="form">
    <button type="button" class="icon-btn" id="plus-btn" title="Aur options">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="icon-btn" id="attach-btn" title="Photo upload karo">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </button>
    <input type="file" id="file-input" accept="image/*" multiple style="display:none">
    <textarea id="input" rows="1" placeholder="Apna doubt likho..."></textarea>
    <button type="button" class="icon-btn" id="mic-btn" title="Bolkar poochho">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></svg>
    </button>
    <button type="submit" class="icon-btn send-btn" id="send-btn" title="Bhejo">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <p style="text-align:center;color:var(--muted);font-size:11px;margin:8px 0 0;">Galaxy · by Abhishek MS</p>
</div>

<script>
const chat = document.getElementById('chat');
const emptyState = document.getElementById('empty-state');
const form = document.getElementById('form');
const input = document.getElementById('input');
const attachBtn = document.getElementById('attach-btn');
const fileInput = document.getElementById('file-input');
const previewStrip = document.getElementById('preview-strip');
const sendBtn = document.getElementById('send-btn');

let pendingImages = []; // {data, mediaType}
let history = []; // {role, content}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 110) + 'px';
});

attachBtn.addEventListener('click', () => fileInput.click());
document.getElementById('plus-btn').addEventListener('click', () => fileInput.click());

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    if (chip.dataset.text === '') {
      fileInput.click();
    } else {
      input.value = chip.dataset.text;
      input.focus();
      input.dispatchEvent(new Event('input'));
    }
  });
});

const micBtn = document.getElementById('mic-btn');
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRec) {
  const recog = new SpeechRec();
  recog.lang = 'hi-IN';
  recog.interimResults = false;
  let listening = false;
  micBtn.addEventListener('click', () => {
    if (listening) return;
    listening = true;
    micBtn.style.color = 'var(--violet)';
    recog.start();
  });
  recog.onresult = (e) => {
    input.value += (input.value ? ' ' : '') + e.results[0][0].transcript;
    input.dispatchEvent(new Event('input'));
  };
  recog.onend = () => { listening = false; micBtn.style.color = ''; };
  recog.onerror = () => { listening = false; micBtn.style.color = ''; };
} else {
  micBtn.addEventListener('click', () => {
    addMessage('ai', 'Is browser mein voice input support nahi hai — type karke poochho.');
  });
}

fileInput.addEventListener('change', async () => {
  for (const file of fileInput.files) {
    const dataUrl = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
    const mediaType = file.type || 'image/jpeg';
    const base64 = dataUrl.split(',')[1];
    pendingImages.push({ data: base64, mediaType, preview: dataUrl });
  }
  renderPreviews();
  fileInput.value = '';
});

function renderPreviews(){
  previewStrip.innerHTML = '';
  if (pendingImages.length === 0){
    previewStrip.classList.remove('show');
    return;
  }
  previewStrip.classList.add('show');
  pendingImages.forEach((img, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${img.preview}"><button type="button" data-i="${i}">×</button>`;
    div.querySelector('button').addEventListener('click', () => {
      pendingImages.splice(i, 1);
      renderPreviews();
    });
    previewStrip.appendChild(div);
  });
}

function addMessage(role, text, images){
  emptyState.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (images && images.length){
    images.forEach(img => {
      const im = document.createElement('img');
      im.src = img.preview;
      div.appendChild(im);
    });
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text && pendingImages.length === 0) return;

  const imagesForThisMsg = pendingImages;
  addMessage('user', text, imagesForThisMsg);

  const contentBlocks = [];
  imagesForThisMsg.forEach(img => {
    contentBlocks.push({
      type: 'image',
      source: { type: 'base64', media_type: img.mediaType, data: img.data }
    });
  });
  contentBlocks.push({ type: 'text', text: text || 'Is photo ko samjhao.' });

  history.push({ role: 'user', content: contentBlocks });

  input.value = '';
  input.style.height = 'auto';
  pendingImages = [];
  renderPreviews();
  sendBtn.disabled = true;

  const loadingDiv = addMessage('ai loading', 'Galaxy soch raha hai...');

  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Server error');
    let replyText = '';
    if (data.content) {
      replyText = data.content.map(b => b.type === 'text' ? b.text : '').join('\n').trim();
    }
    if (!replyText) replyText = 'Maaf karo, jawab nahi mil paya. Dobara try karo.';
    loadingDiv.remove();
    addMessage('ai', replyText);
    history.push({ role: 'assistant', content: replyText });
  } catch (err) {
    loadingDiv.remove();
    addMessage('ai', 'Kuch erro aa gaya . Thodi der baad phir try karo.');
    console.error(err);
  } finally {
    sendBtn.disabled = false;
  }
});
</script>
</body>
  </html>
